name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check example dependency constraints
        run: yarn constraints

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  swift-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        env:
          WORKING_DIRECTORY: Source

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

  build-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Cache turborepo for Android
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).tasks.find(t => t.taskId === 'react-native-bottom-tabs-example#build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"


  build-ios:
    runs-on: macos-15
    env:
      TURBO_CACHE_DIR: .turbo/ios
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Cache turborepo for iOS
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).tasks.find(t => t.taskId === 'react-native-bottom-tabs-example#build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install cocoapods and plugins
        if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: |
          gem install cocoapods-swift-modular-headers
          cd apps/example
          pod install --project-directory=ios
        env:
          RCT_NEW_ARCH_ENABLED: 1
          NO_FLIPPER: 1

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios-swiftpm:
    name: build-ios-swiftpm (svg ${{ matrix.svg.name }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        svg:
          - name: default
            value: ''
          - name: disabled
            value: '0'
    env:
      RN_BOTTOM_TABS_ENABLE_SVG: ${{ matrix.svg.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up SwiftPM integration
        run: yarn workspace example-swiftpm spm --yes

      - name: Build SwiftPM example for iOS
        run: |
          xcodebuild \
            -project apps/example-swiftpm/ios/ExampleSwiftPM.xcodeproj \
            -scheme ExampleSwiftPM \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/example-swiftpm-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check that no private CoreSVG code is linked
        if: matrix.svg.name == 'disabled'
        run: |
          app="$RUNNER_TEMP/example-swiftpm-build/Build/Products/Release-iphonesimulator/ExampleSwiftPM.app"
          if find "$app" -type f -perm +111 -exec strings -a {} + | grep -E 'CoreSVGWrapper|Q0dTVkdEb2N1bWVud'; then
            echo "::error::The SVG-disabled build still contains private CoreSVG code."
            exit 1
          fi

  build-ios-svg-disabled:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      RN_BOTTOM_TABS_ENABLE_SVG: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Install cocoapods and plugins
        run: |
          gem install cocoapods-swift-modular-headers
          cd apps/example
          pod install --project-directory=ios
        env:
          RCT_NEW_ARCH_ENABLED: 1
          NO_FLIPPER: 1

      - name: Build example for iOS with SVG disabled
        run: |
          xcodebuild \
            -workspace apps/example/ios/ReactNativeBottomTabsExample.xcworkspace \
            -scheme ReactTestApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/example-svg-disabled-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check that no private CoreSVG code is linked
        run: |
          app="$RUNNER_TEMP/example-svg-disabled-build/Build/Products/Debug-iphonesimulator/ReactTestApp.app"
          if find "$app" -type f -perm +111 -exec strings -a {} + | grep -E 'CoreSVGWrapper|Q0dTVkdEb2N1bWVud'; then
            echo "::error::The SVG-disabled build still contains private CoreSVG code."
            exit 1
          fi
