name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP: apps/example/ios/build/e2e/Build/Products/Release-iphonesimulator/ReactTestApp.app
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # The first boot of a simulator takes minutes, so it runs while the app is built. A simulator
      # of the runner image is used: one made with `simctl create` has more to set up.
      - name: Start a simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')
          udid=$(xcrun simctl list devices available -j | jq -r --arg runtime "$runtime" '.devices[$runtime][]? | select(.name == "iPhone 17 Pro") | .udid' | head -n 1)
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create e2e "iPhone 17 Pro" "$runtime")
          fi
          xcrun simctl boot "$udid"
          echo "E2E_DEVICE=$udid" >> "$GITHUB_ENV"
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_ENV"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      # The test app only packages the resources that exist when its pods are installed.
      - name: Bundle JavaScript
        run: yarn workspace react-native-bottom-tabs-example build:ios

      # The native build is reused until something it is made from changes. Everything else,
      # such as the tests and the JavaScript of the examples, only needs a new bundle.
      - name: Restore example app
        id: example-app
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.APP }}
          key: e2e-ios-app-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('.github/workflows/e2e.yml', 'yarn.lock', 'apps/example/app.json', 'apps/example/package.json', 'apps/example/react-native.config.js', 'apps/example/ios/Podfile', 'apps/example/ios/Podfile.lock', 'apps/example/ios/*.swift', 'apps/example/ios/*.h', 'packages/react-native-bottom-tabs/package.json', 'packages/react-native-bottom-tabs/*.podspec', 'packages/react-native-bottom-tabs/ios/**', 'packages/react-native-bottom-tabs/common/**', 'packages/react-native-bottom-tabs/src/**') }}

      - name: Install cocoapods
        if: ${{ steps.example-app.outputs.cache-hit != 'true' }}
        run: |
          gem install cocoapods-swift-modular-headers
          cd apps/example
          pod install --project-directory=ios
        env:
          RCT_NEW_ARCH_ENABLED: 1
          NO_FLIPPER: 1

      - name: Build example for the iOS simulator
        if: ${{ steps.example-app.outputs.cache-hit != 'true' }}
        run: yarn workspace react-native-bottom-tabs-example e2e:build:ios

      - name: Save example app
        if: ${{ steps.example-app.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ${{ env.APP }}
          key: ${{ steps.example-app.outputs.cache-primary-key }}

      - name: Put the new bundle in the restored app
        if: ${{ steps.example-app.outputs.cache-hit == 'true' }}
        run: |
          cp apps/example/dist/main.ios.jsbundle "$APP/main.ios.jsbundle"
          rm -rf "$APP/assets"
          cp -R apps/example/dist/assets "$APP/assets"

      # The XCTest runner that drives the simulator takes minutes to build.
      - name: Restore agent-device runner
        id: agent-device-runner
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$E2E_DEVICE"

      # Built and started before the run, or the first tests time out while they wait for it.
      - name: Prepare agent-device runner
        run: npx --no-install agent-device prepare ios-runner --platform ios --udid "$E2E_DEVICE" --timeout 600000

      - name: Save agent-device runner
        if: ${{ steps.agent-device-runner.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.agent-device/apple-runner/derived
          key: agent-device-runner-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      # A broken build fails every test, each after its timeouts. Stop early instead.
      - name: Run e2e tests
        run: yarn workspace react-native-bottom-tabs-example e2e:ios --max-failures 3

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-ios
          path: packages/example-shared/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Install JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('apps/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-e2e-

      # Built before the emulator boots, so the two do not compete for the runner's cores.
      - name: Build example for the Android emulator
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
          E2E_ANDROID_ABI: x86_64
        run: yarn workspace react-native-bottom-tabs-example e2e:build:android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run e2e tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: yarn workspace react-native-bottom-tabs-example e2e:android --max-failures 3

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-android
          path: packages/example-shared/.e2e
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
